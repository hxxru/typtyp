<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typtyp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'EB Garamond', serif;
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .falling-word {
            position: absolute;
            font-size: 24px;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        .falling-word.cleared {
            opacity: 0;
            transform: scale(1.2);
        }

        #input-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
        }

        #word-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 28px;
            padding: 10px 0;
            outline: none;
            text-align: center;
        }

        #word-input::placeholder {
            color: #666;
        }

        #score {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 20px;
        }

        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 32px;
        }

        #game-over.show {
            display: block;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #restart-btn:hover {
            background: #fff;
            color: #000;
        }

        #settings-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        #settings-btn:hover {
            background: #fff;
            color: #000;
            transform: rotate(45deg);
        }

        #settings-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid #fff;
            padding: 40px;
            min-width: 400px;
            z-index: 1000;
        }

        #settings-modal.show {
            display: block;
        }

        .settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
        }

        .settings-overlay.show {
            display: block;
        }

        .setting-item {
            margin-bottom: 30px;
        }

        .setting-label {
            font-size: 18px;
            margin-bottom: 10px;
            display: block;
        }

        .setting-value {
            color: #888;
            margin-left: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }

        select {
            width: 100%;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px;
            font-family: 'EB Garamond', serif;
            font-size: 16px;
            cursor: pointer;
        }

        select option {
            background: #000;
            color: #fff;
        }

        #close-settings {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        #close-settings:hover {
            background: #fff;
            color: #000;
        }

        .settings-title {
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading words...</div>

    <div id="game-container" style="display: none;">
        <button id="settings-btn">⚙</button>
        <div id="score">Score: <span id="score-value">0</span></div>
        <div id="game-over">
            <div>Game Over!</div>
            <div style="font-size: 20px; margin-top: 10px;">Final Score: <span id="final-score">0</span></div>
            <button id="restart-btn">Restart</button>
        </div>
    </div>

    <div class="settings-overlay"></div>
    <div id="settings-modal">
        <div class="settings-title">Settings</div>

        <div class="setting-item">
            <label class="setting-label">
                Word Speed
                <span class="setting-value" id="speed-value">1.0x</span>
            </label>
            <input type="range" id="speed-slider" min="5" max="30" value="10" step="1">
        </div>

        <div class="setting-item">
            <label class="setting-label">Word Length</label>
            <select id="length-select">
                <option value="any">Any</option>
                <option value="short">Short (1-5 letters)</option>
                <option value="medium">Medium (6-8 letters)</option>
                <option value="long">Long (9+ letters)</option>
            </select>
        </div>

        <div class="setting-item">
            <div class="checkbox-container">
                <input type="checkbox" id="zen-mode-checkbox">
                <label class="setting-label" for="zen-mode-checkbox" style="margin: 0;">Zen Mode (No Game Over)</label>
            </div>
        </div>

        <button id="close-settings">Close</button>
    </div>

    <div id="input-container" style="display: none;">
        <input type="text" id="word-input" placeholder="type here..." autocomplete="off" autofocus>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const wordInput = document.getElementById('word-input');
        const scoreValue = document.getElementById('score-value');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const settingsOverlay = document.querySelector('.settings-overlay');
        const closeSettingsBtn = document.getElementById('close-settings');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        const lengthSelect = document.getElementById('length-select');
        const zenModeCheckbox = document.getElementById('zen-mode-checkbox');
        const loadingEl = document.getElementById('loading');
        const inputContainer = document.getElementById('input-container');

        // Word lists
        let allWords = [];
        let filteredWords = [];

        // Game state
        let fallingWords = [];
        let score = 0;
        let gameActive = false;
        let spawnInterval;
        let animationFrame;
        let difficulty = 1;

        // Settings
        let speedMultiplier = 1.0;
        let wordLengthFilter = 'any';
        let zenMode = false;

        // Load and filter words
        async function loadWords() {
            try {
                const response = await fetch('corpus.txt');
                const text = await response.text();
                const words = text.split('\n')
                    .map(w => w.trim())
                    .filter(w => w.length > 0 && !w.includes('-') && !w.includes(' ') && w === w.toLowerCase()); // Filter out empty, hyphenated, spaces, and capital letters

                allWords = words;
                updateFilteredWords();

                // Hide loading, show game
                loadingEl.style.display = 'none';
                gameContainer.style.display = 'block';
                inputContainer.style.display = 'block';

                // Start the game
                startGame();
            } catch (error) {
                console.error('Error loading words:', error);
                loadingEl.textContent = 'Error loading words. Please refresh.';
            }
        }

        function updateFilteredWords() {
            switch (wordLengthFilter) {
                case 'short':
                    filteredWords = allWords.filter(w => w.length >= 1 && w.length <= 5);
                    break;
                case 'medium':
                    filteredWords = allWords.filter(w => w.length >= 6 && w.length <= 8);
                    break;
                case 'long':
                    filteredWords = allWords.filter(w => w.length >= 9);
                    break;
                default:
                    filteredWords = allWords;
            }
        }

        class FallingWord {
            constructor(word) {
                this.word = word;
                this.x = Math.random() * (window.innerWidth - 200) + 100;
                this.y = 0;
                this.speed = (0.5 + (difficulty * 0.1)) * speedMultiplier;
                this.element = this.createElement();
            }

            createElement() {
                const div = document.createElement('div');
                div.className = 'falling-word';
                div.textContent = this.word;
                div.style.left = this.x + 'px';
                div.style.top = this.y + 'px';
                gameContainer.appendChild(div);
                return div;
            }

            update() {
                this.y += this.speed;
                this.element.style.top = this.y + 'px';
            }

            remove() {
                this.element.classList.add('cleared');
                setTimeout(() => {
                    if (this.element.parentNode) {
                        this.element.parentNode.removeChild(this.element);
                    }
                }, 300);
            }

            isOffScreen() {
                return this.y > window.innerHeight - 100;
            }
        }

        function spawnWord() {
            if (!gameActive) return;

            if (filteredWords.length === 0) {
                console.warn('No words available for current filter');
                return;
            }

            const randomWord = filteredWords[Math.floor(Math.random() * filteredWords.length)];
            const word = new FallingWord(randomWord);
            fallingWords.push(word);
        }

        function gameLoop() {
            if (!gameActive) return;

            // Update all falling words
            for (let i = fallingWords.length - 1; i >= 0; i--) {
                const word = fallingWords[i];
                word.update();

                // Check if word reached bottom
                if (word.isOffScreen()) {
                    if (zenMode) {
                        // In zen mode, just remove the word
                        word.remove();
                        fallingWords.splice(i, 1);
                    } else {
                        // In normal mode, end the game
                        endGame();
                        return;
                    }
                }
            }

            animationFrame = requestAnimationFrame(gameLoop);
        }

        function checkWord() {
            const typedWord = wordInput.value.trim();

            if (typedWord === '') return;

            // Find matching word (prioritize words that are lower on screen)
            let matchIndex = -1;
            let lowestY = -1;

            for (let i = 0; i < fallingWords.length; i++) {
                if (fallingWords[i].word === typedWord) {
                    if (fallingWords[i].y > lowestY) {
                        lowestY = fallingWords[i].y;
                        matchIndex = i;
                    }
                }
            }

            if (matchIndex !== -1) {
                // Remove the word
                fallingWords[matchIndex].remove();
                fallingWords.splice(matchIndex, 1);

                // Update score
                score += 10;
                scoreValue.textContent = score;

                // Increase difficulty every 50 points
                if (score % 50 === 0) {
                    difficulty += 0.5;
                }

                // Clear input
                wordInput.value = '';
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationFrame);

            finalScoreEl.textContent = score;
            gameOverScreen.classList.add('show');
            wordInput.disabled = true;
        }

        function startGame() {
            // Reset game state
            gameActive = true;
            score = 0;
            difficulty = 1;
            scoreValue.textContent = score;

            // Clear existing words
            fallingWords.forEach(word => {
                if (word.element.parentNode) {
                    word.element.parentNode.removeChild(word.element);
                }
            });
            fallingWords = [];

            // Hide game over screen
            gameOverScreen.classList.remove('show');
            wordInput.disabled = false;
            wordInput.value = '';
            wordInput.focus();

            // Start spawning words
            spawnInterval = setInterval(spawnWord, 2000);

            // Start game loop
            gameLoop();

            // Spawn first word immediately
            spawnWord();
        }

        // Settings functions
        function openSettings() {
            gameActive = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationFrame);
            settingsModal.classList.add('show');
            settingsOverlay.classList.add('show');
            wordInput.disabled = true;
        }

        function closeSettings() {
            settingsModal.classList.remove('show');
            settingsOverlay.classList.remove('show');
            wordInput.disabled = false;
            wordInput.focus();

            // Don't restart game if it's game over
            if (!gameOverScreen.classList.contains('show')) {
                gameActive = true;
                spawnInterval = setInterval(spawnWord, 2000);
                gameLoop();
            }
        }

        function updateSpeedSetting() {
            // Map slider value (5-30) to speed multiplier (0.5-3.0)
            speedMultiplier = speedSlider.value / 10;
            speedValue.textContent = speedMultiplier.toFixed(1) + 'x';
        }

        function updateLengthSetting() {
            wordLengthFilter = lengthSelect.value;
            updateFilteredWords();
        }

        function updateZenMode() {
            zenMode = zenModeCheckbox.checked;
        }

        // Event listeners
        wordInput.addEventListener('input', checkWord);

        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkWord();
            }
        });

        restartBtn.addEventListener('click', startGame);

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', closeSettings);

        speedSlider.addEventListener('input', updateSpeedSetting);
        lengthSelect.addEventListener('change', updateLengthSetting);
        zenModeCheckbox.addEventListener('change', updateZenMode);

        // Load words and start the game
        loadWords();
    </script>
</body>
</html>
