<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>typtyp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'EB Garamond', serif;
            overflow: hidden;
            height: 100vh;
            position: fixed;
            width: 100%;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
        }

        .falling-word {
            position: absolute;
            font-size: 24px;
            white-space: nowrap;
            transition: opacity 1s ease, transform 1s ease;
        }

        .falling-word.cleared {
            opacity: 0;
            transform: scale(1.5);
        }

        .falling-word.highlighted {
            color: #888;
        }

        .falling-word.failed {
            color: #ff4444;
        }

        #input-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
        }

        #word-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 28px;
            padding: 10px 0;
            outline: none;
            text-align: center;
        }

        #word-input::placeholder {
            color: #666;
        }

        #score {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 20px;
            text-align: right;
        }

        #stats {
            position: fixed;
            top: 50px;
            right: 20px;
            font-size: 16px;
            color: #888;
        }

        #pause-btn {
            position: fixed;
            top: 20px;
            left: 70px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        #pause-btn:hover {
            background: #fff;
            color: #000;
        }

        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 32px;
        }

        #game-over.show {
            display: block;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #restart-btn:hover {
            background: #fff;
            color: #000;
        }

        #settings-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        #settings-btn:hover {
            background: #fff;
            color: #000;
            transform: rotate(45deg);
        }

        #settings-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 2px solid #fff;
            padding: 40px;
            min-width: 400px;
            z-index: 1000;
        }

        #settings-modal.show {
            display: block;
        }

        .settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
        }

        .settings-overlay.show {
            display: block;
        }

        .setting-item {
            margin-bottom: 30px;
        }

        .setting-label {
            font-size: 18px;
            margin-bottom: 10px;
            display: block;
        }

        .setting-value {
            color: #888;
            margin-left: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }

        select {
            width: 100%;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px;
            font-family: 'EB Garamond', serif;
            font-size: 16px;
            cursor: pointer;
        }

        select option {
            background: #000;
            color: #fff;
        }

        #close-settings {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        #close-settings:hover {
            background: #fff;
            color: #000;
        }

        .settings-title {
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }

        /* Mobile styles */
        @media (max-width: 600px) {
            #settings-btn,
            #pause-btn {
                width: 44px;
                height: 44px;
            }

            #pause-btn {
                left: 74px;
            }

            #score {
                font-size: 16px;
                top: 15px;
                right: 15px;
            }

            #stats {
                font-size: 14px;
                top: 40px;
                right: 15px;
            }

            #settings-modal {
                min-width: auto;
                width: 90%;
                max-width: 400px;
                padding: 30px 20px;
            }

            .settings-title {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .setting-item {
                margin-bottom: 20px;
            }

            .setting-label {
                font-size: 16px;
            }

            #word-input {
                font-size: 24px;
            }

            #input-container {
                width: 90%;
                bottom: 20px;
            }

            #game-over {
                font-size: 28px;
            }

            #restart-btn {
                padding: 12px 24px;
                font-size: 18px;
            }

            .falling-word {
                font-size: 20px;
            }

            input[type="range"]::-webkit-slider-thumb {
                width: 28px;
                height: 28px;
            }

            input[type="range"]::-moz-range-thumb {
                width: 28px;
                height: 28px;
            }

            select {
                padding: 12px;
                font-size: 16px;
            }

            input[type="checkbox"] {
                width: 24px;
                height: 24px;
            }
        }

        /* Prevent zoom on input focus for iOS */
        @media (max-width: 600px) {
            input[type="text"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="loading">Loading words...</div>

    <div id="game-container" style="display: none;">
        <button id="settings-btn">⚙</button>
        <button id="pause-btn">❚❚</button>
        <div id="score">Score: <span id="score-value">0</span></div>
        <div id="stats"><span id="cps-value">0.00</span> chars/sec</div>
        <div id="game-over">
            <div>Game Over!</div>
            <div style="font-size: 20px; margin-top: 10px;">Final Score: <span id="final-score">0</span></div>
            <button id="restart-btn">Restart</button>
        </div>
    </div>

    <div class="settings-overlay"></div>
    <div id="settings-modal">
        <div class="settings-title">Settings</div>

        <div class="setting-item">
            <label class="setting-label">
                Word Speed
                <span class="setting-value" id="speed-value">1.0x</span>
            </label>
            <input type="range" id="speed-slider" min="5" max="30" value="10" step="1">
        </div>

        <div class="setting-item">
            <label class="setting-label">Word Corpus</label>
            <select id="corpus-select">
                <option value="corpora/eng_adjectives.txt">English Adjectives</option>
                <option value="corpora/scientific_jargon.txt">Scientific Jargon</option>
                <option value="corpora/korean_idioms.txt">사자성어 (Korean Idioms)</option>
            </select>
        </div>

        <div class="setting-item">
            <label class="setting-label">Word Length</label>
            <select id="length-select">
                <option value="any">Any</option>
                <option value="short">Short (1-5 letters)</option>
                <option value="medium">Medium (6-8 letters)</option>
                <option value="long">Long (9+ letters)</option>
            </select>
        </div>

        <div class="setting-item">
            <div class="checkbox-container">
                <input type="checkbox" id="zen-mode-checkbox">
                <label class="setting-label" for="zen-mode-checkbox" style="margin: 0;">Zen Mode (No Game Over)</label>
            </div>
        </div>

        <button id="close-settings">Close</button>
    </div>

    <div id="input-container" style="display: none;">
        <input type="text" id="word-input" placeholder="type here..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const wordInput = document.getElementById('word-input');
        const scoreValue = document.getElementById('score-value');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const settingsOverlay = document.querySelector('.settings-overlay');
        const closeSettingsBtn = document.getElementById('close-settings');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        const corpusSelect = document.getElementById('corpus-select');
        const lengthSelect = document.getElementById('length-select');
        const zenModeCheckbox = document.getElementById('zen-mode-checkbox');
        const loadingEl = document.getElementById('loading');
        const inputContainer = document.getElementById('input-container');
        const pauseBtn = document.getElementById('pause-btn');
        const cpsValue = document.getElementById('cps-value');

        // Word lists
        let allWords = [];
        let filteredWords = [];

        // Game state
        let fallingWords = [];
        let score = 0;
        let gameActive = false;
        let isPaused = false;
        let spawnInterval;
        let animationFrame;
        let difficulty = 1;

        // Stats tracking
        let totalCharsTyped = 0;
        let gameStartTime = 0;

        // Settings
        let speedMultiplier = 1.0;
        let corpusPath = 'corpora/eng_adjectives.txt';
        let wordLengthFilter = 'any';
        let zenMode = false;

        // Mobile viewport tracking
        let viewportHeight = window.innerHeight;

        // Load and filter words
        async function loadWords(isInitial = false) {
            try {
                const response = await fetch(corpusPath);
                const text = await response.text();

                // Apply different filters based on corpus type
                let words = text.split('\n').map(w => w.trim()).filter(w => w.length > 0);

                if (corpusPath.includes('eng_adjectives')) {
                    // English: filter hyphenated, spaces, and capitals
                    words = words.filter(w => !w.includes('-') && !w.includes(' ') && w === w.toLowerCase());
                } else if (corpusPath.includes('scientific_jargon')) {
                    // Scientific: keep hyphens, filter spaces and capitals
                    words = words.filter(w => !w.includes(' ') && w === w.toLowerCase());
                }
                // Korean (사자성어): no additional filtering needed

                allWords = words;
                updateFilteredWords();

                // Hide loading, show game (only on initial load)
                if (isInitial) {
                    loadingEl.style.display = 'none';
                    gameContainer.style.display = 'block';
                    inputContainer.style.display = 'block';
                    startGame();
                }
            } catch (error) {
                console.error('Error loading words:', error);
                loadingEl.textContent = 'Error loading words. Please refresh.';
            }
        }

        function updateFilteredWords() {
            switch (wordLengthFilter) {
                case 'short':
                    filteredWords = allWords.filter(w => w.length >= 1 && w.length <= 5);
                    break;
                case 'medium':
                    filteredWords = allWords.filter(w => w.length >= 6 && w.length <= 8);
                    break;
                case 'long':
                    filteredWords = allWords.filter(w => w.length >= 9);
                    break;
                default:
                    filteredWords = allWords;
            }
        }

        class FallingWord {
            constructor(word) {
                this.word = word;
                // Adjust spawn range for screen width
                const padding = Math.min(100, window.innerWidth * 0.15);
                const maxX = window.innerWidth - padding * 2;
                this.x = Math.random() * maxX + padding;
                this.y = 0;
                this.baseSpeed = (0.5 + (difficulty * 0.1)) * speedMultiplier;
                this.element = this.createElement();
            }

            createElement() {
                const div = document.createElement('div');
                div.className = 'falling-word';
                div.textContent = this.word;
                div.style.left = this.x + 'px';
                div.style.top = this.y + 'px';
                // Random font size variation (smaller range on mobile)
                const isMobile = window.innerWidth <= 600;
                const baseSize = isMobile ? 16 : 20;
                const variation = isMobile ? 6 : 8;
                const fontSize = baseSize + Math.random() * variation;
                div.style.fontSize = fontSize + 'px';
                gameContainer.appendChild(div);
                return div;
            }

            update() {
                // Calculate speed based on screen position
                // Speed scales with % of screen left to cover, minimum 20%
                const bottomLimit = viewportHeight - 100;
                const percentRemaining = Math.max(0.2, (bottomLimit - this.y) / bottomLimit);
                const currentSpeed = this.baseSpeed * percentRemaining;

                this.y += currentSpeed;
                this.element.style.top = this.y + 'px';
            }

            remove() {
                this.element.classList.add('cleared');
                setTimeout(() => {
                    if (this.element.parentNode) {
                        this.element.parentNode.removeChild(this.element);
                    }
                }, 1000);
            }

            isOffScreen() {
                return this.y > viewportHeight - 100;
            }
        }

        function spawnWord() {
            if (!gameActive || isPaused) return;

            if (filteredWords.length === 0) {
                console.warn('No words available for current filter');
                return;
            }

            const randomWord = filteredWords[Math.floor(Math.random() * filteredWords.length)];
            const word = new FallingWord(randomWord);
            fallingWords.push(word);
        }

        function gameLoop() {
            if (!gameActive || isPaused) return;

            // Update all falling words
            for (let i = fallingWords.length - 1; i >= 0; i--) {
                const word = fallingWords[i];
                word.update();

                // Check if word reached bottom
                if (word.isOffScreen()) {
                    if (zenMode) {
                        // In zen mode, just remove the word
                        word.remove();
                        fallingWords.splice(i, 1);
                    } else {
                        // In normal mode, end the game
                        // Turn the failed word red
                        word.element.classList.add('failed');
                        endGame();
                        return;
                    }
                }
            }

            // Update CPS
            updateCPS();

            animationFrame = requestAnimationFrame(gameLoop);
        }

        function updateCPS() {
            if (gameStartTime === 0) return;
            const elapsedSeconds = (Date.now() - gameStartTime) / 1000;
            if (elapsedSeconds > 0) {
                const cps = (totalCharsTyped / elapsedSeconds).toFixed(2);
                cpsValue.textContent = cps;
            }
        }

        function updateWordHighlights() {
            const typedWord = wordInput.value.trim().toLowerCase();

            for (const word of fallingWords) {
                if (typedWord.length > 0 && word.word.toLowerCase().startsWith(typedWord)) {
                    word.element.classList.add('highlighted');
                } else {
                    word.element.classList.remove('highlighted');
                }
            }
        }

        function checkWord() {
            const typedWord = wordInput.value.trim();

            if (typedWord === '') {
                updateWordHighlights();
                return;
            }

            // Find matching word (prioritize words that are lower on screen)
            let matchIndex = -1;
            let lowestY = -1;

            for (let i = 0; i < fallingWords.length; i++) {
                if (fallingWords[i].word === typedWord) {
                    if (fallingWords[i].y > lowestY) {
                        lowestY = fallingWords[i].y;
                        matchIndex = i;
                    }
                }
            }

            if (matchIndex !== -1) {
                // Track chars typed
                totalCharsTyped += typedWord.length;

                // Remove the word
                fallingWords[matchIndex].remove();
                fallingWords.splice(matchIndex, 1);

                // Update score (1 point per character)
                score += typedWord.length;
                scoreValue.textContent = score;

                // Increase difficulty every 50 points
                if (score % 50 === 0) {
                    difficulty += 0.5;
                }

                // Clear input
                wordInput.value = '';
            }

            // Update highlights
            updateWordHighlights();
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationFrame);

            finalScoreEl.textContent = score;
            gameOverScreen.classList.add('show');
            wordInput.disabled = true;
        }

        function startGame() {
            // Reset game state
            gameActive = true;
            isPaused = false;
            score = 0;
            difficulty = 1;
            totalCharsTyped = 0;
            gameStartTime = Date.now();
            scoreValue.textContent = score;
            cpsValue.textContent = '0.00';
            pauseBtn.textContent = '❚❚';

            // Clear existing words
            fallingWords.forEach(word => {
                if (word.element.parentNode) {
                    word.element.parentNode.removeChild(word.element);
                }
            });
            fallingWords = [];

            // Hide game over screen
            gameOverScreen.classList.remove('show');
            wordInput.disabled = false;
            wordInput.value = '';
            wordInput.focus();

            // Start spawning words
            spawnInterval = setInterval(spawnWord, 2000);

            // Start game loop
            gameLoop();

            // Spawn first word immediately
            spawnWord();
        }

        function togglePause() {
            if (gameOverScreen.classList.contains('show')) return;
            if (settingsModal.classList.contains('show')) return;

            isPaused = !isPaused;

            if (isPaused) {
                pauseBtn.textContent = '▶';
                clearInterval(spawnInterval);
                cancelAnimationFrame(animationFrame);
            } else {
                pauseBtn.textContent = '❚❚';
                spawnInterval = setInterval(spawnWord, 2000);
                gameLoop();
                wordInput.focus();
            }
        }

        // Settings functions
        function openSettings() {
            gameActive = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationFrame);
            settingsModal.classList.add('show');
            settingsOverlay.classList.add('show');
            wordInput.disabled = true;
        }

        function closeSettings() {
            settingsModal.classList.remove('show');
            settingsOverlay.classList.remove('show');
            wordInput.disabled = false;
            wordInput.focus();

            // Don't restart game if it's game over
            if (!gameOverScreen.classList.contains('show')) {
                gameActive = true;
                spawnInterval = setInterval(spawnWord, 2000);
                gameLoop();
            }
        }

        function updateSpeedSetting() {
            // Map slider value (5-30) to speed multiplier (0.5-3.0)
            speedMultiplier = speedSlider.value / 10;
            speedValue.textContent = speedMultiplier.toFixed(1) + 'x';
        }

        function updateLengthSetting() {
            wordLengthFilter = lengthSelect.value;
            updateFilteredWords();
        }

        function updateZenMode() {
            zenMode = zenModeCheckbox.checked;
        }

        function updateCorpusSetting() {
            corpusPath = corpusSelect.value;
            loadWords();
        }

        // Event listeners
        wordInput.addEventListener('input', checkWord);

        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkWord();
            }
        });

        // Global keyboard listener for ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                togglePause();
            }
        });

        restartBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', closeSettings);

        speedSlider.addEventListener('input', updateSpeedSetting);
        corpusSelect.addEventListener('change', updateCorpusSetting);
        lengthSelect.addEventListener('change', updateLengthSetting);
        zenModeCheckbox.addEventListener('change', updateZenMode);

        // Handle viewport changes (mobile keyboard)
        function updateViewportHeight() {
            if (window.visualViewport) {
                viewportHeight = window.visualViewport.height;
                // Resize game container to fit visual viewport
                gameContainer.style.height = viewportHeight + 'px';
                // Reposition input container above keyboard
                const keyboardHeight = window.innerHeight - viewportHeight;
                inputContainer.style.bottom = (keyboardHeight + 20) + 'px';
            } else {
                viewportHeight = window.innerHeight;
                gameContainer.style.height = '100vh';
                inputContainer.style.bottom = '40px';
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateViewportHeight);
            window.visualViewport.addEventListener('scroll', updateViewportHeight);
        }
        window.addEventListener('resize', updateViewportHeight);

        // Load words and start the game
        loadWords(true);
    </script>
</body>
</html>
