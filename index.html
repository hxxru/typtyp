<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typtyp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'EB Garamond', serif;
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .falling-word {
            position: absolute;
            font-size: 24px;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        .falling-word.cleared {
            opacity: 0;
            transform: scale(1.2);
        }

        #input-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
        }

        #word-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 28px;
            padding: 10px 0;
            outline: none;
            text-align: center;
        }

        #word-input::placeholder {
            color: #666;
        }

        #score {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 20px;
        }

        #game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 32px;
        }

        #game-over.show {
            display: block;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'EB Garamond', serif;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #restart-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score">Score: <span id="score-value">0</span></div>
        <div id="game-over">
            <div>Game Over!</div>
            <div style="font-size: 20px; margin-top: 10px;">Final Score: <span id="final-score">0</span></div>
            <button id="restart-btn">Restart</button>
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="word-input" placeholder="type here..." autocomplete="off" autofocus>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const wordInput = document.getElementById('word-input');
        const scoreValue = document.getElementById('score-value');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // Word list for the game
        const wordList = [
            'the', 'quick', 'brown', 'fox', 'jumps', 'over', 'lazy', 'dog',
            'type', 'word', 'game', 'speed', 'fast', 'slow', 'time', 'code',
            'play', 'win', 'lose', 'score', 'level', 'start', 'end', 'clear',
            'hello', 'world', 'computer', 'keyboard', 'screen', 'mouse',
            'window', 'door', 'house', 'tree', 'river', 'mountain', 'ocean',
            'cloud', 'rain', 'sun', 'moon', 'star', 'light', 'dark', 'night',
            'day', 'morning', 'evening', 'afternoon', 'midnight', 'noon'
        ];

        let fallingWords = [];
        let score = 0;
        let gameActive = true;
        let spawnInterval;
        let animationFrame;
        let difficulty = 1;

        class FallingWord {
            constructor(word) {
                this.word = word;
                this.x = Math.random() * (window.innerWidth - 200) + 100;
                this.y = 0;
                this.speed = 0.5 + (difficulty * 0.1);
                this.element = this.createElement();
            }

            createElement() {
                const div = document.createElement('div');
                div.className = 'falling-word';
                div.textContent = this.word;
                div.style.left = this.x + 'px';
                div.style.top = this.y + 'px';
                gameContainer.appendChild(div);
                return div;
            }

            update() {
                this.y += this.speed;
                this.element.style.top = this.y + 'px';
            }

            remove() {
                this.element.classList.add('cleared');
                setTimeout(() => {
                    if (this.element.parentNode) {
                        this.element.parentNode.removeChild(this.element);
                    }
                }, 300);
            }

            isOffScreen() {
                return this.y > window.innerHeight - 100;
            }
        }

        function spawnWord() {
            if (!gameActive) return;

            const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
            const word = new FallingWord(randomWord);
            fallingWords.push(word);
        }

        function gameLoop() {
            if (!gameActive) return;

            // Update all falling words
            for (let i = fallingWords.length - 1; i >= 0; i--) {
                const word = fallingWords[i];
                word.update();

                // Check if word reached bottom
                if (word.isOffScreen()) {
                    endGame();
                    return;
                }
            }

            animationFrame = requestAnimationFrame(gameLoop);
        }

        function checkWord() {
            const typedWord = wordInput.value.trim();

            if (typedWord === '') return;

            // Find matching word (prioritize words that are lower on screen)
            let matchIndex = -1;
            let lowestY = -1;

            for (let i = 0; i < fallingWords.length; i++) {
                if (fallingWords[i].word === typedWord) {
                    if (fallingWords[i].y > lowestY) {
                        lowestY = fallingWords[i].y;
                        matchIndex = i;
                    }
                }
            }

            if (matchIndex !== -1) {
                // Remove the word
                fallingWords[matchIndex].remove();
                fallingWords.splice(matchIndex, 1);

                // Update score
                score += 10;
                scoreValue.textContent = score;

                // Increase difficulty every 50 points
                if (score % 50 === 0) {
                    difficulty += 0.5;
                }

                // Clear input
                wordInput.value = '';
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(animationFrame);

            finalScoreEl.textContent = score;
            gameOverScreen.classList.add('show');
            wordInput.disabled = true;
        }

        function startGame() {
            // Reset game state
            gameActive = true;
            score = 0;
            difficulty = 1;
            scoreValue.textContent = score;

            // Clear existing words
            fallingWords.forEach(word => {
                if (word.element.parentNode) {
                    word.element.parentNode.removeChild(word.element);
                }
            });
            fallingWords = [];

            // Hide game over screen
            gameOverScreen.classList.remove('show');
            wordInput.disabled = false;
            wordInput.value = '';
            wordInput.focus();

            // Start spawning words
            spawnInterval = setInterval(spawnWord, 2000);

            // Start game loop
            gameLoop();

            // Spawn first word immediately
            spawnWord();
        }

        // Event listeners
        wordInput.addEventListener('input', checkWord);

        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkWord();
            }
        });

        restartBtn.addEventListener('click', startGame);

        // Start the game
        startGame();
    </script>
</body>
</html>
